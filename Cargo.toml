[package]
name = "halo-validator"
version = "0.2.2"
edition = "2024"
description = "Rust 2024 validation library with derive macros, schema validation, and i18n messages."
license = "MIT OR Apache-2.0"
repository = "https://github.com/halo-space/validator"
readme = "README.md"
rust-version = "1.97"
keywords = ["validation", "validator", "derive", "schema", "i18n"]
categories = ["data-structures", "parsing"]
exclude = [".github/", "tests/", "benches/"]

[features]
default = ["format", "network"]
format = []
network = ["dep:http", "dep:url"]

[dependencies]
http = { version = "1", optional = true }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
unicode-ident = "1"
url = { version = "2", optional = true }
validator-derive = { package = "halo-validator-derive", version = "0.2.1", path = "derive" }

[lib]
name = "halo"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
trybuild = "1"

[[bench]]
name = "validation"
harness = false
